<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio Inmobiliario</title>
    <!-- Chart.js para la gráfica -->
    <script src="https://jsdelivr.net"></script>
    
    <!-- CSS Nativo Optimizado y Veloz -->
    <style>
        :root {
            --bg-main: #f8fafc;
            --surface: #ffffff;
            --primary: #1e40af;
            --primary-light: #eff6ff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #059669;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header { background: var(--surface); padding: 20px; border-radius: 16px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 24px; }
        h1 { font-size: 24px; color: var(--primary); font-weight: 800; }
        .subtitle { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
        
        #estadoConexion { font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 20px; }
        .loading { background: #fef3c7; color: #92400e; }
        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }

        .dashboard { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 24px; }
        @media (max-width: 768px) { .dashboard { grid-template-columns: 1fr; } }
        
        .card { background: var(--surface); padding: 20px; border-radius: 16px; border: 1px solid var(--border); }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; color: var(--text-main); }
        .chart-container { position: relative; height: 260px; width: 100%; }
        
        .filter-group { display: flex; flex-direction: column; gap: 15px; height: 100%; justify-content: space-between; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #f8fafc; font-size: 14px; outline: none; }
        select:focus { border-color: var(--primary); }
        .counter-box { background: var(--primary-light); padding: 15px; border-radius: 12px; border: 1px solid #dbeafe; }
        .counter-label { font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--primary); tracking-wider; }
        .counter-val { font-size: 32px; font-weight: 900; color: var(--primary); }

        .table-container { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { background: #f1f5f9; padding: 12px 16px; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border); }
        td { padding: 14px 16px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        tr:hover { background: #f8fafc; }
        
        .prop-img { width: 70px; height: 50px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
        .prop-title { font-weight: 700; color: var(--text-main); }
        .prop-type { font-size: 11px; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; color: var(--text-muted); display: inline-block; margin-top: 4px; }
        .prop-price { font-weight: 700; color: var(--accent); font-size: 15px; }
        .prop-specs { font-size: 12px; color: var(--text-muted); }
        
        .btn-ficha { display: inline-block; background: var(--primary-light); color: var(--primary); padding: 8px 12px; border-radius: 8px; text-decoration: none; font-size: 12px; font-weight: 700; border: 1px solid #dbeafe; transition: all 0.2s; text-align: center; }
        .btn-ficha:hover { background: var(--primary); color: white; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Encabezado -->
        <header>
            <div>
                <h1>🏢 Control de Inventario Inmobiliario</h1>
                <p class="subtitle">Catálogo propio optimizado de alto rendimiento.</p>
            </div>
            <div id="estadoConexion" class="loading">⏳ Conectando con Google Sheets...</div>
        </header>

        <!-- Dashboard -->
        <div class="dashboard">
            <div class="card">
                <div class="card-title">Comparativa de Precios por Proyecto</div>
                <div class="chart-container">
                    <canvas id="chartPrecios"></canvas>
                </div>
            </div>
            
            <div class="card">
                <div class="filter-group">
                    <div>
                        <div class="card-title" style="margin-bottom: 8px;">Filtros</div>
                        <label style="font-size: 12px; color: var(--text-muted); display:block; margin-bottom: 6px;">Barrio / Zona:</label>
                        <select id="selectBarrio" onchange="filtrarPropiedades()">
                            <option value="todos">✨ Mostrar Todos los Barrios</option>
                        </select>
                    </div>
                    <div class="counter-box">
                        <div class="counter-label">Inmuebles Disponibles</div>
                        <div id="totalInmuebles" class="counter-val">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Proyecto / Tipo</th>
                        <th>Barrio</th>
                        <th>Precio (COP)</th>
                        <th>Características</th>
                        <th style="text-align: center;">Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaInmuebles">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Nueva URL estructural usando el lector de visualización de Google para evitar errores de CSV crudo
        const SHEET_ID = '180UEG3GExXiWr5VwaTQ7zMsPZuihOujym73dEijeyI4';
        const GOOGLE_JSON_URL = `https://google.com{SHEET_ID}/gviz/tq?tqx=out:json`;

        let todasLasPropiedades = [];
        let miGrafico = null;

        async function inicializarApp() {
            const indicador = document.getElementById('estadoConexion');
            try {
                const respuesta = await fetch(GOOGLE_JSON_URL, { cache: "no-store" });
                if (!respuesta.ok) throw new Error("Fallo de red");
                
                const textoPlano = await respuesta.text();
                // Google Sheets retorna el JSON envuelto en una función de callback que debemos limpiar
                const inicioJSON = textoPlano.indexOf('{');
                const finJSON = textoPlano.lastIndexOf('}') + 1;
                const jsonLimpio = JSON.parse(textoPlano.substring(inicioJSON, finJSON));
                
                const filas = jsonLimpio.table.rows;
                
                // Mapeamos dinámicamente cada columna inspeccionando los valores reales
                todasLasPropiedades = filas.map(f => {
                    const c = f.c;
                    return {
                        origen: c[0] ? String(c[0].v) : '',
                        tipo: c[1] ? String(c[1].v) : '',
                        nombre: c[2] ? String(c[2].v) : 'Inmueble sin nombre',
                        barrio: c[3] ? String(c[3].v) : '',
                        precioRaw: c[4] ? String(c[4].v) : '0',
                        area: c[5] ? String(c[5].v) : '0',
                        habitaciones: c[6] ? String(c[6].v) : '0',
                        banos: c[7] ? String(c[7].v) : '0',
                        ficha: c[8] ? String(c[8].v) : '#',
                        imagen: c[9] ? String(c[9].v) : ''
                    };
                }).filter(p => p.nombre !== 'Proyecto / Nombre' && p.nombre !== 'Inmueble sin nombre'); // Filtra encabezados si los hay

                indicador.className = "success";
                indicador.textContent = "🟢 Sincronizado";

                configurarFiltros(todasLasPropiedades);
                actualizarPantalla(todasLasPropiedades);
            } catch (error) {
                console.error("Error detallado:", error);
                indicador.className = "error";
                indicador.textContent = "🔴 Error al conectar";
            }
        }

        function configurarFiltros(propiedades) {
            const select = document.getElementById('selectBarrio');
            const barriosUnicos = [...new Set(propiedades.map(p => p.barrio).filter(b => b))];
            barriosUnicos.sort().forEach(barrio => {
                const opcion = document.createElement('option');
                opcion.value = barrio;
                opcion.textContent = barrio;
                select.appendChild(opcion);
            });
        }

        function filtrarPropiedades() {
            const barrioSeleccionado = document.getElementById('selectBarrio').value;
            const filtradas = barrioSeleccionado === 'todos' 
                ? todasLasPropiedades 
                : todasLasPropiedades.filter(p => p.barrio === barrioSeleccionado);
            actualizarPantalla(filtradas);
        }

        function actualizarPantalla(propiedades) {
            document.getElementById('totalInmuebles').textContent = propiedades.length;
